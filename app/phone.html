<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3F80">
<title>Emerald Marketplace — Montserrat, West Indies</title>
<meta name="description" content="Buy, sell, find work and book travel across Montserrat.">
<!-- Lets someone "Add to Home Screen" and get a chrome-free app-like window. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  /* Phone-only build. On a desktop it sits in the usual device frame; on an
     actual phone it drops the frame and fills the screen, so it reads as the
     app rather than a picture of one. */
  .em-stage { padding: 30px 20px; }

  @media (max-width: 700px) {
    body { background: #FBF8F1; }
    .em-stage { padding: 0; min-height: 100dvh; }
    .em-phone {
      width: 100vw;
      max-width: none;
      /* dvh tracks the browser's collapsing address bar; vh is the fallback. */
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>

<section class="em-stage">
  <div class="em-phone" id="phone"></div>
</section>

<!-- No desktop module: this build never renders the web app. -->
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/screens-mobile-a.js"></script>
<script src="js/screens-mobile-b.js"></script>
<script src="js/app.js"></script>
</body>
</html>
