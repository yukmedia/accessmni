<style>
/* Emerald Marketplace — page chrome only.
   Everything inside the two frames is styled inline by the screen modules, so
   this file stays limited to the stage, the device frames and global resets. */

body {
  margin: 0;
  background: #EDEAE3;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: #16233A;
  -webkit-font-smoothing: antialiased;
}

a { color: #0E3F80; text-decoration: none; }

/* Scrollbars are hidden throughout — the frames still scroll, they just don't
   show a track that would break the illusion of a real device. */
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }

/* Inputs inherit the page family so the search fields match everything else. */
input, button, textarea { font-family: inherit; }

.em-stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 40px 20px 60px;
  box-sizing: border-box;
}

/* ---------- phone ---------- */

.em-phone {
  width: 390px;
  height: 844px;
  flex-shrink: 0;
  background: #FBF8F1;
  border-radius: 38px;
  box-shadow: 0 30px 60px -20px rgba(23, 35, 29, 0.35), 0 0 0 1px rgba(23, 35, 29, 0.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative; /* anchors the sort sheets and modal overlays */
}

/* ---------- desktop web app ---------- */

.em-web {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-top: 30px;
  width: 100%;
}

.em-web-label {
  font-size: 13px;
  color: #7C8697;
  font-weight: 700;
}

.em-web-clip {
  width: 900px;
  max-width: 92vw;
  display: flex;
  justify-content: center;
}

.em-web-frame {
  width: 1440px;
  flex-shrink: 0;
  /* `zoom` scales the box AND its layout size, so the 1440px design shrinks to
     fit the 900px column without being clipped or leaving dead space. */
  zoom: 0.625;
  background: #FFFFFF;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 30px 60px -24px rgba(23, 35, 29, 0.35), 0 0 0 1px rgba(23, 35, 29, 0.08);
}

/* Firefox has no `zoom`; fall back to a transform, accepting that the parent
   reserves untransformed height (a little extra space below the mock). */
@supports not (zoom: 1) {
  .em-web-frame {
    transform: scale(0.625);
    transform-origin: top center;
  }
  .em-web-clip { height: 1150px; overflow: hidden; }
}

/* On a narrow screen the desktop mock is the thing to drop first. */
@media (max-width: 700px) {
  .em-stage { padding: 16px 0 40px; gap: 10px; }
  .em-phone { width: 100%; max-width: 390px; border-radius: 0; box-shadow: none; }
}
</style>
<style>
  /* Phone-only build. On a desktop it sits in the usual device frame; on an
     actual phone it drops the frame and fills the screen, so it reads as the
     app rather than a picture of one. */
  .em-stage { padding: 30px 20px; }

  @media (max-width: 700px) {
    body { background: #FBF8F1; }
    .em-stage { padding: 0; min-height: 100dvh; }
    .em-phone {
      width: 100vw;
      max-width: none;
      /* dvh tracks the browser's collapsing address bar; vh is the fallback. */
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>

<script>
/* Emerald Marketplace — state store and render loop.

   The prototype re-derived its whole view from one state object on every
   change, so this keeps that model: setState -> re-render both frames.
   Two things have to survive a full re-render to keep the demo feeling real:
   the caret in the search box, and the scroll position of any scrolling list.
   Elements opt in with data-focus-key / data-scroll-key. */

(function (global) {
  'use strict';

  var state = {
    // navigation
    screen: 'home',           // which mobile screen is showing
    market: 'sellers',        // sellers | wanted | jobs | shops | travel

    // listings
    cat: [],                  // selected category keys (single-select in practice)
    vehSub: null,             // vehicle sub-category
    sortBy: 'newest',
    sortOpen: false,
    listView: false,
    searchSaved: false,

    // other markets
    shopCat: 'all',
    wantedCat: 'all',
    wantedSortBy: 'newest',
    wantedSortOpen: false,
    jobCat: 'all',
    jobSortBy: 'newest',
    jobSortOpen: false,

    // search
    searchQuery: '',

    // detail pages
    detailItem: 'generator',  // generator (Land Cruiser) | mango
    carPhotoIdx: 0,
    qaOpen: false,

    // inbox / offers
    msgTab: 'messages',
    offer: 'open',            // open | accepted | declined

    // cart
    cartCount: 2,
    ramsQty: 1,
    hilltopQty: 1,
    ramsSaved: false,
    hilltopSaved: false,
    ramsRemoved: false,
    hilltopRemoved: false,
    cartSummaryOpen: false,

    // account
    isSeller: true,
    verified: false,

    // overlays
    wantedGateOpen: false,
    aiAssistOpen: false,

    // banners
    hasActiveOrder: true,

    // desktop-only view state
    deskDetail: false,
    deskItem: null,
    deskSub: null             // null | 'job' | 'shop'
  };

  var listeners = [];
  var frame = null;

  function get() { return state; }

  function setState(patch) {
    Object.keys(patch).forEach(function (k) { state[k] = patch[k]; });
    schedule();
  }

  function subscribe(fn) { listeners.push(fn); }

  function schedule() {
    if (frame) return;
    frame = requestAnimationFrame(function () {
      frame = null;
      render();
    });
  }

  /* ---------- render with focus + scroll preservation ---------- */

  function captureFocus() {
    var el = document.activeElement;
    if (!el || !el.dataset || !el.dataset.focusKey) return null;
    return {
      key: el.dataset.focusKey,
      start: el.selectionStart,
      end: el.selectionEnd
    };
  }

  function restoreFocus(saved) {
    if (!saved) return;
    var el = document.querySelector('[data-focus-key="' + saved.key + '"]');
    if (!el) return;
    el.focus();
    if (saved.start != null && el.setSelectionRange) {
      try { el.setSelectionRange(saved.start, saved.end); } catch (e) { /* not a text input */ }
    }
  }

  function captureScroll() {
    var out = {};
    document.querySelectorAll('[data-scroll-key]').forEach(function (el) {
      out[el.dataset.scrollKey] = el.scrollTop;
    });
    return out;
  }

  function restoreScroll(saved) {
    document.querySelectorAll('[data-scroll-key]').forEach(function (el) {
      var v = saved[el.dataset.scrollKey];
      if (v) el.scrollTop = v;
    });
  }

  function render() {
    var savedFocus = captureFocus();
    var savedScroll = captureScroll();
    listeners.forEach(function (fn) { fn(state); });
    restoreScroll(savedScroll);
    restoreFocus(savedFocus);
  }

  global.EMStore = {
    get: get, setState: setState, subscribe: subscribe, render: render
  };
})(window);
</script>

    return '<div ' + act(action) + ' style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #0E3F80; cursor: pointer; background: #E4EDF9; padding: 5px 9px; border-radius: 7px;">' + label + ' ⌄</div>';
  }

  /* ---- Listings ---- */

  function listingCard(item, s) {
    var cardStyle = s.listView
      ? 'background:#FFFFFF;border:1px solid #E8E4D9;border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:row'
      : 'background:#FFFFFF;border:1px solid #E8E4D9;border-radius:16px;overflow:hidden;cursor:pointer';
    var imgExtra = s.listView ? 'width:110px;height:110px;' : '';
    var flag = item.sponsored
      ? '<div style="position: absolute; top: 7px; left: 7px; background: rgba(28,42,34,0.75); color: #F0E2B0; font-size: 9px; font-weight: 800; letter-spacing: 0.04em; padding: 3px 7px; border-radius: 4px;">SPONSORED</div>'
      : item.tag
        ? '<div style="position: absolute; top: 7px; left: 7px; background: #5B6FBA; color: #FFFFFF; font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 4px;">' + item.tag + '</div>'
        : item.urgency
          ? '<div style="position: absolute; top: 7px; left: 7px; background: #A8483A; color: #FFFFFF; font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 4px;">' + item.urgency + '</div>'
          : '';
    return '<div ' + act('openListing', item.id) + ' style="' + cardStyle + '">'
      + '<div style="height: 96px; ' + bg(item.img, item.tint) + ' position: relative; flex-shrink: 0; ' + imgExtra + '">'
      + flag
      + '<div style="position: absolute; top: 7px; right: 7px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #0E3F80;">♡</div></div>'
      + '<div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px;">'
      + '<div style="display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: ' + item.catColor + ';">'
      + '<span style="width: 5px; height: 5px; border-radius: 50%; background: ' + item.catColor + ';"></span>' + item.catLabel + '</div>'
      + '<div style="font-size: 14.5px; font-weight: 800; letter-spacing: -0.02em; color: #16233A; line-height: 1.1;">' + item.price + '</div>'
      + '<div style="font-size: 12px; color: #3A4553; line-height: 1.2;">' + item.title + '</div>'
      + '<div style="font-size: 10.5px; color: #8B94A3; line-height: 1.15;">' + item.location + ' · ' + item.timeAgo + '</div>'
      + '<div style="font-size: 9.5px; color: #A8B3AB; line-height: 1.15;">' + item.views + ' views</div>'
      + when(item.badgeText, '<div style="margin-top: 3px; align-self: flex-start; background: ' + item.badgeBg + '; color: ' + item.badgeColor + '; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 5px;">' + item.badgeText + '</div>')
      + '</div></div>';
  }

  function listingsPanel(s) {
    var items = D.sortedListings(s.cat, s.sortBy);
    var title = !s.cat.length
      ? "What's new nearby"
      : (s.cat.length === 1 ? s.cat[0].charAt(0).toUpperCase() + s.cat[0].slice(1) : s.cat.length + ' categories selected');
    var gridStyle = s.listView ? 'display:flex;flex-direction:column;gap:10px' : 'display:grid;grid-template-columns:1fr 1fr;gap:12px';

    return '<div style="display: flex; flex-direction: column; flex: 1; min-height: 0;">'
      + '<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px;">'
      + '<div style="display: flex; align-items: center; justify-content: space-between;">'
      + '<div style="font-size: 15px; font-weight: 800; color: #16233A;">' + title + '</div>'
      + '<div style="display: flex; align-items: center; gap: 6px;">'
      // Save-search sits with sort/view, applying to the filtered result set.
      + '<div ' + act('toggleSaveSearch') + ' title="' + (s.searchSaved ? 'Search saved' : 'Save this search') + '" style="width: 30px; height: 30px; border-radius: 8px; background: #F4F2EC; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: ' + (s.searchSaved ? '#E09E3B' : '#6C7585') + ';">' + (s.searchSaved ? '★' : '☆') + '</div>'
      + '<div ' + act('toggleListView') + ' style="width: 30px; height: 30px; border-radius: 8px; background: ' + (s.listView ? '#16233A' : '#EFEBE1') + '; display: flex; align-items: center; justify-content: center; cursor: pointer;">'
      + '<svg width="14" height="14" viewBox="0 0 14 14" fill="' + (s.listView ? '#FBF8F1' : '#6C7585') + '"><rect x="0" y="0" width="14" height="3" rx="1.5"/><rect x="0" y="5.5" width="14" height="3" rx="1.5"/><rect x="0" y="11" width="14" height="3" rx="1.5"/></svg></div>'
      + sortPill(SORT_LABELS[s.sortBy], 'openSort')
      + '</div></div></div>'
      + '<div data-scroll-key="listings" style="overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 16px;">'
      + '<div style="' + gridStyle + '">' + map(items, function (i) { return listingCard(i, s); }) + '</div>'
      + when(!items.length, '<div style="text-align: center; padding: 40px 16px; color: #8B94A3; font-size: 13px;">Nothing listed in this category yet.</div>')
      + '</div></div>';
  }

  /* ---- Shops ---- */

  function shopCard(shop) {
    var thumb = shop.pattern
      ? 'background: ' + shop.pattern + ';'
      : bg(shop.img, shop.tint);
    var statusPill = shop.statusStyle === 'closed'
      ? '<div style="background: #F2E7E4; color: #A8483A; font-size: 10px; font-weight: 800; padding: 4px 7px; border-radius: 5px;">' + shop.status + '</div>'
      : '<div style="background: #E4EDF9; color: #0E3F80; font-size: 10px; font-weight: 800; padding: 4px 7px; border-radius: 5px;">' + shop.status + '</div>';
    var right = shop.delivers
      ? '<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">' + statusPill
        + '<div style="background: #FBF0DC; color: #8A5B0E; font-size: 9.5px; font-weight: 800; padding: 3px 7px; border-radius: 5px;">DELIVERY AVAIL.</div></div>'
      : statusPill;
    return '<div ' + (shop.screen ? act('nav', shop.screen) : act('noop'))
      + ' style="background: #FFFFFF; border: 1px solid #E8E4D9; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer;">'
      + '<div style="width: 54px; height: 54px; border-radius: 11px; ' + thumb + ' flex-shrink: 0;"></div>'
      + '<div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">'
      + '<div style="font-size: 14px; font-weight: 700; color: #16233A;">' + shop.name + '</div>'
      + '<div style="font-size: 11.5px; color: #7C8697;">' + shop.meta + '</div></div>'
      + right + '</div>';
  }

  function shopsPanel(s) {
    var body = map(D.SHOP_SECTIONS, function (sec, idx) {
      var visible = sec.always ? sec.shops : sec.shops.filter(function (sh) { return D.shopVisible(s.shopCat, sh); });
      if (!visible.length) return '';
      return '<div style="padding: ' + (idx ? '10px' : '2px') + ' 2px 2px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; color: #8B94A3;">' + sec.heading + '</div>'
        + '<div style="display: flex; flex-direction: column; gap: 9px;">' + map(visible, shopCard) + '</div>';
    });
    return '<div style="display: flex; flex-direction: column; flex: 1; min-height: 0;">'
      + '<div data-scroll-key="shops" style="overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 9px;">'
      + body + '<div style="height: 56px; flex-shrink: 0;"></div></div></div>';
  }

  /* ---- Wanted ---- */

  function wantedRow(item) {
    return '<div ' + (item.screen ? act('nav', item.screen) : act('wantedGate'))
      + ' style="background: #FFFFFF; border: 1px solid #E8E4D9; border-radius: 14px; padding: 12px 13px; display: flex; align-items: center; gap: 11px; cursor: pointer;">'
      + '<div style="width: 40px; height: 40px; border-radius: 11px; background: #F4F2EC; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;">' + item.icon + '</div>'
      + '<div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">'
      + '<div style="display: flex; align-items: center; gap: 7px;">'
      + '<div style="font-size: 14px; font-weight: 700; color: #16233A;">' + item.title + '</div>'
      + '<div style="background: #F4F2EC; color: #3A4553; font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 5px; white-space: nowrap;">' + item.catLabel + '</div></div>'
      + '<div style="display: flex; align-items: center; gap: 6px;">'
      + when(item.budgetLabel, '<div style="background: #E4EDF9; color: #0E3F80; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px;">' + item.budgetLabel + '</div>')
      + '<div style="font-size: 11px; color: #8B94A3;">' + item.location + ' · ' + item.timeAgo + ' · ' + item.offers + ' offers</div></div></div>'
      + '<div ' + act('stop') + ' style="font-size: 15px; color: #0E3F80; cursor: pointer;">♡</div>'
      + '<div style="font-size: 15px; color: #C6CDD9;">›</div></div>';
  }

  function wantedPanel(s) {
    var items = D.wantedItems(s.wantedCat, s.wantedSortBy);
    return '<div style="display: flex; flex-direction: column; flex: 1; min-height: 0;">'
      + '<div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px;">'
      + '<div style="font-size: 15px; font-weight: 800; color: #16233A;">What the island is asking for</div>'
      + sortPill(WANTED_SORT_LABELS[s.wantedSortBy], 'openWantedSort') + '</div>'
      + '<div data-scroll-key="wanted" style="overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 9px;">'
      + '<div style="background: #E4EDF9; border-radius: 16px; padding: 13px 14px; display: flex; align-items: center; gap: 12px;">'
      + '<div style="width: 34px; height: 34px; border-radius: 10px; background: #0E3F80; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 16px; font-weight: 700;">?</div>'
      + '<div style="flex: 1; font-size: 12.5px; line-height: 1.4; color: #16233A;">14 neighbours are looking for things. Have it in the shed? Say so.</div></div>'
      + '<div ' + act('nav', 'postWanted') + ' style="background: #0E3F80; color: #FFFFFF; border-radius: 12px; padding: 12px 0; text-align: center; font-size: 14px; font-weight: 700; cursor: pointer;">+ Post a Wanted ad <span style="opacity: 0.7; font-weight: 600;">· Free</span></div>'
      + map(items, wantedRow)
      + when(!items.length, '<div style="text-align: center; padding: 30px 16px; color: #8B94A3; font-size: 13px;">No open asks in this category.</div>')
      + '<div style="text-align: center; font-size: 13px; font-weight: 700; color: #0E3F80; cursor: pointer;">See all 14 asks</div>'
      + '<div style="height: 56px; flex-shrink: 0;"></div></div></div>';
  }

  /* ---- Jobs ---- */

  function jobRow(item) {
    return '<div ' + act('nav', 'jobDetail') + ' style="background: #FFFFFF; border: 1px solid #E8E4D9; border-radius: 14px; padding: 12px 13px; display: flex; align-items: center; gap: 11px; cursor: pointer;">'
      + '<div style="width: 40px; height: 40px; border-radius: 11px; background: #F4F2EC; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;">' + item.icon + '</div>'
      + '<div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">'
      + '<div style="display: flex; align-items: center; gap: 7px;">'
      + '<div style="font-size: 14px; font-weight: 700; color: #16233A;">' + item.title + '</div>'
      + '<div style="background: #F4F2EC; color: #3A4553; font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 5px; white-space: nowrap;">' + item.typeLabel + '</div></div>'
      + '<div style="display: flex; align-items: center; gap: 6px;">'
      + '<div style="background: #E4EDF9; color: #0E3F80; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px;">' + item.payLabel + '</div>'
      + '<div style="font-size: 11px; color: #8B94A3;">' + item.employer + ' · ' + item.location + ' · ' + item.applied + ' applied</div></div></div>'
      + '<div ' + act('stop') + ' style="font-size: 15px; color: #0E3F80; cursor: pointer;">♡</div>'
      + '<div style="font-size: 15px; color: #C6CDD9;">›</div></div>';
  }

  function jobsPanel(s) {
    var items = D.jobItems(s.jobCat, s.jobSortBy);
    return '<div style="display: flex; flex-direction: column; flex: 1; min-height: 0;">'
      + '<div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px;">'
      + '<div style="font-size: 15px; font-weight: 800; color: #16233A;">Job openings</div>'
      + sortPill(JOB_SORT_LABELS[s.jobSortBy], 'openJobSort') + '</div>'
      + '<div data-scroll-key="jobs" style="overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 10px;">'
      + '<div ' + act('wantedGate') + ' style="background: #0E3F80; color: #FFFFFF; border-radius: 12px; padding: 12px 0; text-align: center; font-size: 14px; font-weight: 700; cursor: pointer;">+ Post a job <span style="opacity: 0.7; font-weight: 600;">· Free</span></div>'
      + map(items, jobRow)
      + when(!items.length, '<div style="text-align: center; padding: 30px 16px; color: #8B94A3; font-size: 13px;">No openings in this category right now.</div>')
      + '<div style="height: 56px; flex-shrink: 0;"></div></div></div>';
  }

  /* ---- Travel ---- */

  function stayCard(o, priceKey) {
    return '<div ' + act('noop') + ' style="background: #FFFFFF; border: 1px solid #E8E4D9; border-radius: 16px; overflow: hidden; cursor: pointer; display: flex;">'
      + '<div style="width: 110px; height: 110px; ' + bg(o.img, o.tint) + ' flex-shrink: 0;"></div>'
      + '<div style="padding: 11px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1;">'
      + '<div style="font-size: 14px; font-weight: 700; color: #16233A;">' + o.name + '</div>'
      + '<div style="font-size: 11.5px; color: #7C8697;">' + o.meta + '</div>'
      + '<div style="font-size: 15px; font-weight: 800; color: #16233A; margin-top: 3px;">' + o[priceKey || 'price']
      + '<span style="font-size: 11px; font-weight: 500; color: #7C8697;">' + o.unit + '</span></div></div></div>';
  }

  function travelPanel() {
    return '<div style="display: flex; flex-direction: column; flex: 1; min-height: 0;">'
      + '<div data-scroll-key="travel" style="overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 16px;">'

      + '<div style="display: flex; flex-direction: column; gap: 9px;">'
      + '<div style="display: flex; align-items: center; justify-content: space-between;">'
      + '<div style="font-size: 15px; font-weight: 800; color: #16233A;">Fly to Montserrat</div>'
      + '<div style="font-size: 9px; font-weight: 800; letter-spacing: 0.04em; color: #A8B3AB;">SPONSORED</div></div>'
      + '<div style="display: flex; gap: 8px;">'
      + map(D.AIRLINES, function (a) {
        return '<div ' + act('flymni') + ' style="flex: 1; position: relative; background: #FFFFFF; border: 1px solid #E8E4D9; border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer;">'
          + '<div style="position: absolute; top: 4px; right: 5px; font-size: 6.5px; font-weight: 800; letter-spacing: 0.03em; color: #C6CDD9;">AD</div>'
          + '<div style="width: 30px; height: 30px; border-radius: 7px; background: ' + a.bg + '; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: ' + a.color + '; letter-spacing: -0.02em; text-align: center; line-height: 1.1;">' + a.short + '</div>'
          + '<div style="font-size: 9.5px; font-weight: 700; color: #16233A; text-align: center;">' + a.name + '</div></div>';
      }) + '</div></div>'

      + '<div style="display: flex; flex-direction: column; gap: 9px;">'
      + '<div style="font-size: 15px; font-weight: 800; color: #16233A;">Hotels on the island</div>'
      + map(D.HOTELS, function (h) { return stayCard(h); }) + '</div>'

      + '<div style="display: flex; flex-direction: column; gap: 9px;">'
      + '<div style="font-size: 15px; font-weight: 800; color: #16233A;">Tours &amp; experiences</div>'
      + map(D.TOURS.filter(function (t) { return !t.deskOnly; }), function (t) { return stayCard(t); }) + '</div>'

      + '<div style="height: 56px; flex-shrink: 0;"></div></div></div>';
  }

  /* ---- Browse shell ---- */

  S.browse = function (s) {
    var panel = s.market === 'sellers' ? listingsPanel(s)
      : s.market === 'shops' ? shopsPanel(s)
      : s.market === 'wanted' ? wantedPanel(s)
      : s.market === 'jobs' ? jobsPanel(s)
      : travelPanel(s);

    var showCartBar = s.market === 'shops' && !s.hasActiveOrder;
    var waBottom = (s.hasActiveOrder || showCartBar) ? '138px' : '96px';

    return '<div style="display: flex; flex-direction: column; flex: 1; min-height: 0; position: relative;">'
      + browseHeader(s)
      + '<div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 13px; flex: 1; min-height: 0;">' + panel + '</div>'

      // Persistent help channel — WhatsApp is how the island actually talks.
      + '<div ' + act('whatsapp') + ' style="position: absolute; right: 14px; bottom: ' + waBottom + '; width: 44px; height: 44px; border-radius: 50%; background: #25D366; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -4px rgba(23,35,29,0.4); cursor: pointer; z-index: 15; transition: bottom 0.15s;">'
      + U.ICON.whatsapp + '</div>'

      + when(s.hasActiveOrder,
          '<div ' + act('nav', 'collect') + ' style="background: #F0B454; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">'
          + '<div style="display: flex; align-items: center; gap: 9px;">'
          + '<div style="width: 24px; height: 24px; border-radius: 50%; background: #2A1D06; color: #F0E2B0; font-size: 13px; display: flex; align-items: center; justify-content: center;">✓</div>'
          + '<div style="color: #2A1D06; font-size: 13px; font-weight: 700;">Order ready at Ram\'s, Salem</div></div>'
          + '<div style="color: #2A1D06; font-size: 13px; font-weight: 700;">Collect ›</div></div>')

      + when(showCartBar,
          '<div ' + act('nav', 'cart') + ' style="background: #16233A; padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">'
          + '<div style="display: flex; align-items: center; gap: 9px;">'
          + '<div style="width: 26px; height: 26px; border-radius: 50%; background: #F0B454; color: #2A1D06; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;">' + s.cartCount + '</div>'
          + '<div style="color: #FBF8F1; font-size: 13px; font-weight: 600;">Cart · EC$64</div></div>'
          + '<div style="color: #F0B454; font-size: 13px; font-weight: 700;">Checkout ›</div></div>')

      + '</div>' + U.bottomNav(s);
  };

})(window);
</script>
<script>
/* Emerald Marketplace — mobile: detail pages, checkout, inbox, sell flow,
   account screens and the modal overlays. */

(function (global) {
  'use strict';

  var U = global.EMUI, D = global.EMData;
  var act = U.act, when = U.when, map = U.map, esc = U.esc, bg = U.bg;
  var S = global.EMScreens;

  /* ============================ LISTING DETAIL =========================== */

  // Seller trust card + the Emerald Pay note, shared by both detail variants.
  function sellerCard(name, stats) {
    return '<div ' + act('nav', 'thread') + ' style="background: #FFFFFF; border: 1px solid #E8E4D9; border-radius: 16px; padding: 13px; display: flex; flex-direction: column; gap: 11px; cursor: pointer;">'
      + '<div style="display: flex; align-items: center; gap: 11px;">'
      + U.avatar(40, '#E6E1D4,#DED8C9', 'flex-shrink: 0;')
      + '<div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">'
      + '<div style="display: flex; align-items: center; gap: 6px;">'
      + '<div style="font-size: 14px; font-weight: 700; color: #16233A;">' + name + '</div>'
      + '<div style="background: #E4EDF9; color: #0E3F80; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px;">VERIFIED</div></div>'
      + '<div style="font-size: 11.5px; color: #7C8697;">' + stats + '</div></div>'
      + '<div style="font-size: 15px; color: #0E3F80;">›</div></div>'
      + '<div style="height: 1px; background: #EDE9DD;"></div>'
      + U.payWarning('<strong style="color: #16233A;">Emerald Pay</strong> holds payment until you confirm the item. Off-app cash deals get no refund, no dispute support.')
      + '</div>';
  }

  function qaSection(s, count, rows) {
    return '<div ' + act('toggleQA') + ' style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding-bottom: 4px;">'
      + '<div style="font-size: 13.5px; font-weight: 800; color: #16233A;">Questions &amp; Answers <span style="color: #8B94A3; font-weight: 600;">(' + count + ')</span></div>'
      + '<div style="font-size: 13px; color: #8B94A3;">' + (s.qaOpen ? '▲' : '▼') + '</div></div>'
      + when(s.qaOpen,
          '<div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px;">'
          + '<div ' + act('wantedGate') + ' style="font-size: 12px; font-weight: 700; color: #0E3F80; cursor: pointer; align-self: flex-end;">Ask a question</div>'
          + rows + '</div>');
  }

  function qaItem(q, a, when_) {
    return '<div style="display: flex; flex-direction: column; gap: 3px;">'
      + '<div style="font-size: 12.5px; font-weight: 700; color: #16233A;">Q: ' + q + '</div>'
      + '<div style="font-size: 12.5px; color: #4A5A52; padding-left: 12px;">A: ' + a + '</div>'
      + '<div style="font-size: 10.5px; color: #B0B8AE; padding-left: 12px;">' + when_ + '</div></div>';

      // Buyers who have never sold get an invitation, not an empty dashboard.
      : '<div style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.05em; color: #9AA49C; padding-top: 6px;">SELLING</div>'
        + '<div ' + act('startSelling') + ' style="background: #F4F2EC; border: 1px dashed #C6D0C9; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; cursor: pointer;">'
        + '<div style="width: 40px; height: 40px; border-radius: 50%; background: #16233A; color: #FBF8F1; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;">+</div>'
        + '<div style="font-size: 13.5px; font-weight: 700; color: #16233A;">Start selling on Emerald</div>'
        + '<div style="font-size: 11.5px; color: #8B94A3;">List your first item — free to post, small fee only when it sells</div></div>';

    return '<div style="display: flex; flex-direction: column; height: 100%;">'
      + '<div style="padding: 46px 20px 16px; background: #0E3F80; display: flex; align-items: center; gap: 13px;">'
      + '<div style="width: 52px; height: 52px; border-radius: 50%; background: repeating-linear-gradient(135deg, #2E7256 0 6px, #276549 6px 12px); border: 1.5px solid rgba(255,255,255,0.35);"></div>'
      + '<div style="flex: 1;"><div style="color: #FFFFFF; font-size: 18px; font-weight: 700;">Ashley M.</div>'
      + '<div style="color: rgba(230,238,249,0.75); font-size: 12px; margin-top: 3px;">Salem · joined 2025 · ★ 5.0 (8)</div></div>'
      + '<div ' + act('noop') + ' style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; cursor: pointer;">' + U.ICON.pencil + '</div></div>'

      + '<div data-scroll-key="profile" style="flex: 1; overflow-y: auto; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 14px;">'
      + sellingBlock
      + '<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px; border-top: 1px solid #F0EDE3;">'
      + profileRow(U.ICON.gear, 'Settings &amp; account', 'noop')
      + profileRow(U.ICON.chatBubble, 'Help &amp; support', 'whatsapp')
      + profileRow(U.ICON.logout, 'Log out', 'logOut', '#A8483A')
      + '<div style="text-align: center; font-size: 10.5px; color: #C6CDD9; padding: 10px 0 4px;">Emerald Marketplace · v1.0</div>'
      + '</div></div>' + U.bottomNav(s) + '</div>';
  };

  /* ============================== OVERLAYS ============================== */

  S.overlays = function (s) {
    var out = '';

    if (s.sortOpen) {
      out += U.sheet('closeSort', U.sortRows([
        { key: 'newest', label: 'Newest first' },
        { key: 'price', label: 'Price: low to high' },
        { key: 'priceDesc', label: 'Price: high to low' },
        { key: 'near', label: 'Nearest to me' },
        { key: 'delivery', label: 'Delivery available' },
        { key: 'viewed', label: 'Most viewed' }
      ], s.sortBy, 'sort'));
    }

    if (s.jobSortOpen) {
      out += U.sheet('closeJobSort', U.sortRows([
        { key: 'newest', label: 'Newest first' },
        { key: 'pay', label: 'Pay: low to high' },
        { key: 'payDesc', label: 'Pay: high to low' },
        { key: 'viewed', label: 'Most viewed' }
      ], s.jobSortBy, 'jobSort'));
    }

    if (s.wantedSortOpen) {
      out += U.sheet('closeWantedSort', U.sortRows([
        { key: 'newest', label: 'Newest first' },
        { key: 'budget', label: 'Budget: low to high' },
        { key: 'budgetDesc', label: 'Budget: high to low' },
        { key: 'offers', label: 'Most offers' },
        { key: 'fewOffers', label: 'Fewest offers' }
      ], s.wantedSortBy, 'wantedSort'));
    }

    if (s.wantedGateOpen) {
      out += '<div ' + act('closeWantedGate') + ' style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(23,35,29,0.42); display: flex; align-items: center; justify-content: center; z-index: 25; cursor: pointer; padding: 30px;">'
        + '<div ' + act('stop') + ' style="width: 100%; background: #FFFFFF; border-radius: 18px; padding: 26px 22px; box-shadow: 0 20px 40px -14px rgba(23,35,29,0.45); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">'
        + '<div style="width: 52px; height: 52px; border-radius: 50%; background: #FBF0DC; display: flex; align-items: center; justify-content: center; font-size: 22px;">🔒</div>'
        + '<div style="font-size: 17px; font-weight: 800; color: #16233A;">Create a free account to reply</div>'
        + '<div style="font-size: 13px; color: #7C8697; line-height: 1.5;">Sign up to see who\'s asking and message them directly — takes under a minute.</div>'
        + '<div ' + act('openLogin') + ' style="width: 100%; background: #0E3F80; color: #FFFFFF; border-radius: 12px; padding: 13px 0; text-align: center; font-size: 14.5px; font-weight: 700; cursor: pointer;">Sign up free</div>'
        + '<div ' + act('openLogin') + ' style="font-size: 12.5px; font-weight: 700; color: #0E3F80; cursor: pointer;">I already have an account</div></div></div>';
    }

    if (s.aiAssistOpen) {
      out += '<div ' + act('closeAiAssist') + ' style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(23,35,29,0.42); display: flex; align-items: flex-end; z-index: 25; cursor: pointer;">'
        + '<div ' + act('stop') + ' style="width: 100%; background: #FFFFFF; border-radius: 22px 22px 0 0; padding: 22px 20px 30px; box-shadow: 0 -10px 40px rgba(23,35,29,0.18); display: flex; flex-direction: column; gap: 14px;">'
        + '<div style="width: 36px; height: 4px; border-radius: 3px; background: #E4E1D3; margin: 0 auto;"></div>'
        + '<div style="display: flex; align-items: center; gap: 10px;">'
        + '<div style="width: 36px; height: 36px; border-radius: 10px; background: #0E3F80; display: flex; align-items: center; justify-content: center; font-size: 16px;">✨</div>'
        + '<div style="font-size: 16px; font-weight: 800; color: #16233A;">AI listing assist</div></div>'
        + '<div style="font-size: 13.5px; color: #4A5A52; line-height: 1.5;">Take or upload a photo of your item — AI suggests a title, category, condition and fair price based on similar Montserrat listings. You review and edit before posting.</div>'
        + '<div style="border: 1.5px dashed #C6CDD9; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px;">'
        + '<div style="font-size: 24px; color: #0E3F80;">📷</div>'
        + '<div style="font-size: 13px; font-weight: 700; color: #16233A;">Take a photo</div>'
        + '<div style="font-size: 11.5px; color: #8B94A3;">or choose from your library</div></div>'
        + '<div ' + act('closeAiAssist') + ' style="background: #0E3F80; color: #FFFFFF; border-radius: 13px; padding: 14px 0; text-align: center; font-size: 15px; font-weight: 700; cursor: pointer;">Continue</div></div></div>';
    }

    return out;
  };
})(window);
</script>
<script>
/* Emerald Marketplace — wiring.

   One delegated click listener reads data-act / data-arg off the clicked
   element and runs the matching action, which is the only thing allowed to
   change state. State changes re-render both frames. */

(function (global) {
  'use strict';

  var Store = global.EMStore, S = global.EMScreens, D = global.EMData;

  function set(patch) { Store.setState(patch); }

  // Navigating anywhere dismisses whatever transient UI was open.
  function closeTransient(patch) {
    patch = patch || {};
    patch.sortOpen = false;
    patch.jobSortOpen = false;
    patch.wantedSortOpen = false;
    return patch;
  }

  var actions = {

    /* ---------- navigation ---------- */

    nav: function (screen) {
      var patch = closeTransient({ screen: screen, wantedGateOpen: false, aiAssistOpen: false });
      if (screen === 'detail') patch.detailItem = 'generator';
      if (screen === 'search') patch.searchQuery = '';
      // Leaving a mobile screen also drops the desktop drill-down, so the two
      // frames never disagree about where you are.
      patch.deskDetail = false;
      patch.deskSub = null;
      set(patch);
    },

    market: function (key) {
      set(closeTransient({
        market: key, screen: 'browse', searchQuery: '',
        deskDetail: false, deskSub: null,
        wantedGateOpen: false, aiAssistOpen: false
      }));
    },

    /* ---------- filters ---------- */

    // Single-select: tapping the active chip clears it, tapping another replaces
    // it. Multi-select was tried and dropped — two sub-category rows at once
    // was more confusing than useful.
    cat: function (key) {
      var cur = Store.get().cat;
      var next = !key ? [] : (cur.indexOf(key) !== -1 ? [] : [key]);
      set({ cat: next, vehSub: null, deskDetail: false, deskSub: null, searchQuery: '' });
    },
    vehSub: function (key) { set({ vehSub: Store.get().vehSub === key ? null : key }); },
    shopCat: function (key) { set({ shopCat: key, deskDetail: false, deskSub: null }); },
    jobCat: function (key) { set({ jobCat: key, deskDetail: false, deskSub: null }); },
    wantedCat: function (key) { set({ wantedCat: key, deskDetail: false, deskSub: null }); },

    /* ---------- sorting ---------- */

    openSort: function () { set({ sortOpen: true }); },
    closeSort: function () { set({ sortOpen: false }); },
    sort: function (key) { set({ sortBy: key, sortOpen: false }); },

    openJobSort: function () { set({ jobSortOpen: true }); },
    closeJobSort: function () { set({ jobSortOpen: false }); },
    jobSort: function (key) { set({ jobSortBy: key, jobSortOpen: false }); },

    openWantedSort: function () { set({ wantedSortOpen: true }); },
    closeWantedSort: function () { set({ wantedSortOpen: false }); },
    wantedSort: function (key) { set({ wantedSortBy: key, wantedSortOpen: false }); },

    toggleListView: function () { set({ listView: !Store.get().listView }); },
    toggleSaveSearch: function () { set({ searchSaved: !Store.get().searchSaved }); },

    /* ---------- listings ---------- */

    openListing: function (id) {
      set(closeTransient({ screen: 'detail', detailItem: id === 'mango' ? 'mango' : 'generator', carPhotoIdx: 0 }));
    },
    carPhoto: function (i) { set({ carPhotoIdx: parseInt(i, 10) || 0 }); },
    toggleQA: function () { set({ qaOpen: !Store.get().qaOpen }); },

    /* ---------- search ---------- */

    closeSearch: function () { set({ screen: 'home', searchQuery: '' }); },
    searchFor: function (q) { set({ searchQuery: q }); },

    /* ---------- cart ---------- */

    qty: function (arg) {
      var parts = String(arg).split(':');
      var key = parts[0] + 'Qty';
      var delta = parseInt(parts[1], 10);
      var patch = {};
      patch[key] = Math.max(1, (Store.get()[key] || 1) + delta);
      set(patch);
    },
    saveForLater: function (key) { var p = {}; p[key + 'Saved'] = true; set(p); },
    moveToCart: function (key) { var p = {}; p[key + 'Saved'] = false; set(p); },
    removeItem: function (key) {
      var p = {};
      p[key + 'Removed'] = true;
      p[key + 'Saved'] = false;
      p.cartCount = Math.max(0, Store.get().cartCount - 1);
      set(p);
    },
    toggleCartSummary: function () { set({ cartSummaryOpen: !Store.get().cartSummaryOpen }); },

    /* ---------- offers ---------- */

    acceptOffer: function () { set({ offer: 'accepted' }); },
    declineOffer: function () { set({ offer: 'declined' }); },
    resetOffer: function () { set({ offer: 'open' }); },

    /* ---------- inbox ---------- */

    msgTab: function (tab) { set({ msgTab: tab }); },

    /* ---------- account / gates ---------- */

    wantedGate: function () { set({ wantedGateOpen: true }); },
    closeWantedGate: function () { set({ wantedGateOpen: false }); },
    openLogin: function () { set({ wantedGateOpen: false, screen: 'login' }); },
    logOut: function () { set({ screen: 'login' }); },
    completeVerify: function () { set({ verified: true, screen: 'profile' }); },
    startSelling: function () { set({ isSeller: true, screen: 'sell' }); },

    openAiAssist: function () { set({ aiAssistOpen: true }); },
    closeAiAssist: function () { set({ aiAssistOpen: false }); },

    /* ---------- desktop ---------- */

    deskOpenItem: function (id) {
      var item = D.LISTINGS.filter(function (i) { return i.id === id; })[0] || null;
      set({ deskDetail: true, deskItem: item, deskSub: null });
    },
    deskCloseDetail: function () { set({ deskDetail: false, deskItem: null }); },
    deskOpenJob: function () { set({ deskSub: 'job', deskDetail: false }); },
    deskOpenShop: function () { set({ deskSub: 'shop', deskDetail: false }); },
    deskBack: function () { set({ deskSub: null }); },

    /* ---------- external ---------- */

    whatsapp: function () { global.open('https://wa.me/16648001234', '_blank'); },
    flymni: function () { global.open('https://www.flymontserrat.com', '_blank'); },

    /* ---------- no-ops ---------- */

    // `stop` exists so a click inside a dismissible overlay does not close it;
    // `noop` marks a control that is deliberately inert in the demo.
    stop: function () {},
    noop: function () {}
  };

  // Either frame may be absent: index.html has both, web.html only the desktop
  // (and so does not load the mobile screen modules at all).
  function render(s) {
    var phone = document.getElementById('phone');
    if (phone && S.home) {
      // Screen names match the exported function names one for one.
      var screen = typeof S[s.screen] === 'function' ? S[s.screen] : S.home;
      phone.innerHTML = screen(s) + S.overlays(s);
    }
    var desk = document.getElementById('desktop');
    if (desk) {
      desk.innerHTML = S.desktop(s, { chrome: desk.dataset.chrome !== 'off' });
    }
  }

  /* ---------- events ---------- */

  function onClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var name = el.dataset.act;
    var fn = actions[name];
    if (!fn) return;
    // closest() returns the innermost action, so a heart inside a card runs the
    // heart's handler (often `stop`) and never the card's.
    fn(el.dataset.arg);
  }

  function onInput(e) {
    var el = e.target;
    if (!el.dataset || el.dataset.input !== 'search') return;
    set({ searchQuery: el.value, deskDetail: false, deskSub: null });
  }

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);

  Store.subscribe(render);
  Store.render();
})(window);
</script>
